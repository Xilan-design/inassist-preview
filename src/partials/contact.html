<!-- Обратная связь -->
  <section class="section contact" id="contact" aria-labelledby="contact-title">
    <div class="container contact__grid">
      <div class="contact__text">
        <h2 id="contact-title" data-reveal>Обсудим вашу задачу</h2>
        <p class="lead" data-reveal style="--rd:.12s">Нужны только имя и телефон. Остальное — по желанию, чтобы мы подготовились к разговору.</p>
      </div>

      <div class="contact__form" data-reveal style="--rd:.15s">
        <form class="form" data-form novalidate>
          <fieldset class="field">
            <legend>Что нужно сделать?</legend>
            <div class="chips">
              <label class="chip"><input type="radio" name="topic" value="Бизнес-планирование"><span>Бизнес-план</span></label>
              <label class="chip"><input type="radio" name="topic" value="Реклама"><span>Реклама</span></label>
              <label class="chip"><input type="radio" name="topic" value="Разработка и IT"><span>Сайт или IT</span></label>
              <label class="chip"><input type="radio" name="topic" value="Пока не знаю" checked><span>Пока не знаю</span></label>
            </div>
          </fieldset>
          <div class="form__row">
            <div class="field">
              <label for="cf-name">Имя</label>
              <input id="cf-name" name="name" type="text" autocomplete="name" placeholder="Как к вам обращаться" required>
              <p class="field__error" id="cf-name-err"></p>
            </div>
            <div class="field">
              <label for="cf-phone">Телефон</label>
              <input id="cf-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+375 29 000-00-00" required>
              <p class="field__error" id="cf-phone-err"></p>
            </div>
          </div>
          <div class="field">
            <label for="cf-msg">Коротко о задаче <span class="field__opt">необязательно</span></label>
            <textarea id="cf-msg" name="message" rows="3" placeholder="Например: нужен бизнес-план для кредита на оборудование"></textarea>
          </div>
          <div class="form__foot">
            <div class="field field--check">
              <input id="cf-consent" name="consent" type="checkbox" required>
              <label for="cf-consent">Согласен на обработку персональных данных по <a href="privacy.html">политике конфиденциальности</a></label>
              <p class="field__error" id="cf-consent-err"></p>
            </div>
            <button class="btn btn--cut-left" type="submit">Отправить заявку</button>
          </div>
        </form>
        <div class="form-done" hidden tabindex="-1">
          <h3>Заявка отправлена</h3>
          <p>Перезвоним в течение рабочего дня. Если вопрос срочный, позвоните нам: <a href="tel:+375447285016">+375 44 728-50-16</a>.</p>
        </div>
      </div>
    </div>
  </section>
