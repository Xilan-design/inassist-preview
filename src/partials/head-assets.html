<link rel="preload" href="assets/fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/style.css">
<script>
  // Наведение включаем только там, где есть мышь или тачпад (см. :where(.can-hover *) в style.css)
  (function (d) {
    var mq = matchMedia('(hover: hover) and (pointer: fine)');
    var set = function () { d.classList.toggle('can-hover', mq.matches); };
    set();
    if (mq.addEventListener) mq.addEventListener('change', set);
  })(document.documentElement);

  // Прячем элементы для анимации появления до первой отрисовки, чтобы не было мигания.
  // Если main.js по какой-то причине не загрузится, через 3 с всё просто покажется.
  (function (d) {
    if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    d.classList.add('js-reveal');
    setTimeout(function () { if (!window.revealReady) d.classList.remove('js-reveal'); }, 3000);
  })(document.documentElement);
</script>
<script src="assets/js/main.js" defer></script>
